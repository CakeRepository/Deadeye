name: Package and release

# Pushing a tag such as v0.2.0-beta builds ForeverHunter-<tag>.zip with the
# BigWigs packager and attaches it to a GitHub release. Tags containing
# "alpha" or "beta" are marked as such.
#
# CurseForge uploads switch on once the repository has a CF_API_TOKEN secret
# and ForeverHunter.toc has a "## X-Curse-Project-ID:" line (see README).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
